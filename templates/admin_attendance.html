<!DOCTYPE html>
<html>

<head>
    <title>View Attendance</title>
    <style>
        body {
            font-family: 'Segoe UI', sans-serif;
            background: #f4f7f6;
            margin: 0;
            padding: 20px;
            color: #333;
        }

        .container {
            max-width: 1000px;
            margin: auto;
            background: #fff;
            padding: 25px;
            border-radius: 10px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.05);
        }

        h2 {
            margin-top: 0;
            color: #2c3e50;
            border-bottom: 2px solid #3498db;
            padding-bottom: 10px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
        }

        th,
        td {
            padding: 12px;
            border-bottom: 1px solid #ddd;
            text-align: left;
        }

        th {
            background: #f8f9fa;
            color: #2c3e50;
        }

        .back-btn {
            background: #95a5a6;
            text-decoration: none;
            margin-bottom: 15px;
            display: inline-block;
            padding: 6px 12px;
            color: white;
            border-radius: 5px;
        }
    </style>
</head>

<body>
    <div class="container">
        <a href="/admin/dashboard" class="back-btn">← Back</a>
        <h2>All Attendance Records</h2>
        <table>
            <tr>
                <th>Date</th>
                <th>Employee ID</th>
                <th>Name</th>
                <th>Check In</th>
                <th>Check Out</th>
                <th>Status</th>
            </tr>
            {% for att in attendance_records %}
            <tr>
                <td>{{ att.date }}</td>
                <td>{{ att.user.employee_id }}</td>
                <td>{{ att.user.name }}</td>
                <td>{{ att.check_in }}</td>
                <td>{{ att.check_out or '-' }}</td>
                <td>{{ att.status }}</td>
            </tr>
            {% endfor %}
        </table>
    </div>
</body>

</html>
