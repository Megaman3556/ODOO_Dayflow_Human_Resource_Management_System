<!DOCTYPE html>
<html>

<head>
    <title>Admin Dashboard</title>
    <style>
        body {
            font-family: 'Segoe UI', sans-serif;
            background: #f4f7f6;
            margin: 0;
            padding: 20px;
            color: #333;
        }

        .container {
            max-width: 1000px;
            margin: auto;
            background: #fff;
            padding: 25px;
            border-radius: 10px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.05);
        }

        h2 {
            margin-top: 0;
            color: #2c3e50;
            border-bottom: 2px solid #3498db;
            padding-bottom: 10px;
        }

        .cards {
            display: flex;
            gap: 20px;
            margin: 20px 0;
        }

        .card {
            flex: 1;
            background: #f8f9fa;
            padding: 20px;
            border-radius: 8px;
            text-align: center;
            border-left: 4px solid #3498db;
        }

        .card h3 {
            margin: 0;
            color: #2c3e50;
            font-size: 24px;
        }

        .btn {
            display: inline-block;
            padding: 10px 15px;
            background: #3498db;
            color: white;
            text-decoration: none;
            border-radius: 5px;
            font-size: 14px;
            margin-right: 10px;
            margin-top: 10px;
        }

        .btn:hover {
            background: #2980b9;
        }

        .btn-danger {
            background: #e74c3c;
        }
    </style>
</head>

<body>
    <div class="container">
        <h2>Admin Dashboard 👋</h2>
        <div class="cards">
            <div class="card">
                <h3>{{ employees|length }}</h3>
                <p>Total Employees</p>
            </div>
            <div class="card">
                <h3>{{ pending_leaves }}</h3>
                <p>Pending Leaves</p>
            </div>
        </div>
        <div>
            <a href="/admin/employees" class="btn">Manage Employees</a>
            <a href="/admin/leaves" class="btn">Manage Leaves</a>
            <a href="/admin/attendance" class="btn">View Attendance</a>
            <a href="/admin/payroll" class="btn">Manage Payroll</a>
            <a href="/logout" class="btn btn-danger">Logout</a>
        </div>
    </div>
</body>

</html>
