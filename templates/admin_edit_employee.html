<!DOCTYPE html>
<html>

<head>
    <title>Edit Payroll</title>
    <style>
        body {
            font-family: 'Segoe UI', sans-serif;
            background: #f4f7f6;
            margin: 0;
            padding: 20px;
            color: #333;
        }

        .container {
            max-width: 600px;
            margin: auto;
            background: #fff;
            padding: 25px;
            border-radius: 10px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.05);
        }

        h2 {
            margin-top: 0;
            color: #2c3e50;
            border-bottom: 2px solid #3498db;
            padding-bottom: 10px;
        }

        .form-group {
            margin-bottom: 15px;
        }

        label {
            display: block;
            margin-bottom: 5px;
            font-weight: 600;
        }

        input {
            width: 100%;
            padding: 8px;
            border: 1px solid #ccc;
            border-radius: 5px;
            box-sizing: border-box;
        }

        .btn {
            padding: 10px 15px;
            background: #2ecc71;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            width: 100%;
            font-size: 16px;
        }

        .back-btn {
            background: #95a5a6;
            display: inline-block;
            padding: 6px 12px;
            color: white;
            text-decoration: none;
            border-radius: 5px;
            margin-bottom: 15px;
        }
    </style>
</head>

<body>
    <div class="container">
        <a href="/admin/payroll" class="back-btn">← Back</a>
        <h2>Edit Payroll for {{ user.name }}</h2>
        <form method="POST">
            <div class="form-group"><label>Cost to Company (Annual)</label><input type="number" step="0.01"
                    name="cost_to_company_annual" value="{{ salary.cost_to_company_annual or 0 }}" required></div>
            <div class="form-group"><label>Basic Salary (Annual)</label><input type="number" step="0.01"
                    name="basic_annual" value="{{ salary.basic_annual or 0 }}" required></div>
            <div class="form-group"><label>HRA (Annual)</label><input type="number" step="0.01" name="hra_annual"
                    value="{{ salary.hra_annual or 0 }}" required></div>
            <div class="form-group"><label>Net Take Home (Annual)</label><input type="number" step="0.01"
                    name="net_salary_annual" value="{{ salary.net_salary_annual or 0 }}" required></div>
            <button type="submit" class="btn">Update Payroll</button>
        </form>
    </div>
</body>

</html>
