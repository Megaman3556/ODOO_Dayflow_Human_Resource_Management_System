<!DOCTYPE html>
<html>

<head>
    <title>Manage Payroll</title>
    <style>
        body {
            font-family: 'Segoe UI', sans-serif;
            background: #f4f7f6;
            margin: 0;
            padding: 20px;
            color: #333;
        }

        .container {
            max-width: 1000px;
            margin: auto;
            background: #fff;
            padding: 25px;
            border-radius: 10px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.05);
        }

        h2 {
            margin-top: 0;
            color: #2c3e50;
            border-bottom: 2px solid #3498db;
            padding-bottom: 10px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
        }

        th,
        td {
            padding: 12px;
            border-bottom: 1px solid #ddd;
            text-align: left;
        }

        th {
            background: #f8f9fa;
            color: #2c3e50;
        }

        .btn {
            padding: 6px 12px;
            background: #3498db;
            color: white;
            text-decoration: none;
            border-radius: 5px;
            font-size: 14px;
        }

        .back-btn {
            background: #95a5a6;
            margin-bottom: 15px;
            display: inline-block;
            padding: 6px 12px;
            color: white;
            text-decoration: none;
            border-radius: 5px;
        }
    </style>
</head>

<body>
    <div class="container">
        <a href="/admin/dashboard" class="back-btn">← Back</a>
        <h2>Payroll Structure</h2>
        <table>
            <tr>
                <th>Employee ID</th>
                <th>Name</th>
                <th>CTC (Annual)</th>
                <th>Basic (Annual)</th>
                <th>Net Salary (Annual)</th>
                <th>Action</th>
            </tr>
            {% for sal in salaries %}
            <tr>
                <td>{{ sal.user.employee_id }}</td>
                <td>{{ sal.user.name }}</td>
                <td>₹{{ sal.cost_to_company_annual or 0 }}</td>
                <td>₹{{ sal.basic_annual or 0 }}</td>
                <td>₹{{ sal.net_salary_annual or 0 }}</td>
                <td><a href="/admin/payroll/{{ sal.user.employee_id }}/edit" class="btn">Edit</a></td>
            </tr>
            {% endfor %}
        </table>
    </div>
</body>

</html>
